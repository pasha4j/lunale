name: Mushroom forecast

on:
  schedule:
    # Cron is UTC and best-effort. In practice runs start ~5 hours late
    # (10/9–10/10: a 10:17 slot ran at 15:53), and top-of-hour slots can be
    # dropped. So schedule early, off the hour, with backups; the first run
    # that lands wins and later ones skip. 05:17 UTC is already the new day
    # in ET year-round (1:17am EDT / 12:17am EST).
    - cron: "17 5 * * *"
    - cron: "17 7 * * *"
    - cron: "17 9 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mushroom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Skip if today's forecast is already published
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          built=$(python3 -c "import json; print(json.load(open('mushroom/data.json'))['today'])")
          today=$(TZ=America/New_York date +%F)
          echo "built=$built today=$today"
          if [ "$built" = "$today" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch, score, write mushroom/data.json
        if: steps.fresh.outputs.skip != 'true'
        run: python3 scripts/mushroom/build.py

      - name: Commit and push
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898704+github-actions[bot]@users.noreply.github.com"
          git add mushroom/data.json mushroom/history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "mushroom $(TZ=America/New_York date +%F)"
          # The grades job on the Mac pushes to main too; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
