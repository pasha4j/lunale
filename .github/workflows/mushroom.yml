name: Mushroom forecast

on:
  schedule:
    # Cron is UTC and best-effort: GitHub delays or drops runs at busy times,
    # worst at the top of the hour (the original "0 10" never fired on 10/9).
    # Off-hour slots, several of them; the first that runs wins and later ones
    # skip. 10:17 UTC = 6:17am EDT, 11:17 UTC = 6:17am EST.
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
    - cron: "47 12 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mushroom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Skip if today's forecast is already published
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          built=$(python3 -c "import json; print(json.load(open('mushroom/data.json'))['today'])")
          today=$(TZ=America/New_York date +%F)
          echo "built=$built today=$today"
          if [ "$built" = "$today" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch, score, write mushroom/data.json
        if: steps.fresh.outputs.skip != 'true'
        run: python3 scripts/mushroom/build.py

      - name: Commit and push
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898704+github-actions[bot]@users.noreply.github.com"
          git add mushroom/data.json mushroom/history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "mushroom $(TZ=America/New_York date +%F)"
          # The grades job on the Mac pushes to main too; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
