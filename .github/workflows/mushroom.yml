name: Mushroom forecast

on:
  schedule:
    - cron: "0 10 * * *"   # UTC: 6am EDT / 5am EST. Scheduled runs often start late.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mushroom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, score, write mushroom/data.json
        run: python3 scripts/mushroom/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898704+github-actions[bot]@users.noreply.github.com"
          git add mushroom/data.json mushroom/history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "mushroom $(TZ=America/New_York date +%F)"
          # The grades job on the Mac pushes to main too; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
